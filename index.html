<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Remote Browser Client</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }
    
  </style>
</head>
<body>

  <!-- This is where the remote DOM will be rendered -->
  
  
  <img id="screen" style="width:100%; display:block;" />

  <script>
    const ws = new WebSocket("wss://sibp.onrender.com");

    ws.onopen = () => {
      console.log("Connected to server");
      ws.send(JSON.stringify({
        type: "navlink",
        link: "https://google.com"
      }));
      console.log("Initial Link Sent");
    };

    ws.onmessage = event => {

      const msg = JSON.parse(event.data);

      if (msg.type === "frame") {
        console.log(typeof msg.data, msg.data.slice(0, 50));
        document.getElementById("screen").src = `data:image/jpeg;base64,${msg.data}`;
      }
    };

    document.addEventListener("click", e => {
        ws.send(JSON.stringify({
            type: "input",
            inputType: "click",
            x: e.clientX,
            y: e.clientY
        }));
        console.log("clicked X: " + e.clientX + ", Y: " + e.clientY); 
    });
    document.addEventListener("keydown", e => {
        ws.send(JSON.stringify({
            type: "input",
            inputType: "keydown",
            key: e.key
        }));
      console.log("Keydown: ", e.key);
    });
    document.addEventListener("keyup", e => {
        ws.send(JSON.stringify({
            type: "input",
            inputType: "keyup",
            key: e.key
        }));
      console.log("Keyup: ", e.key);
    });
  
    let lastSent = 0;
    document.addEventListener("scroll", () => {
        const now = Date.now();
        if (now - lastSent > 30) { // send every 30ms
            lastSent = now;
            ws.send(JSON.stringify({
                type: "input",
                inputType: "scroll",
                scrollX: window.scrollX,
                scrollY: window.scrollY
            }));
          console.log("scroll log");
        }
    }, true);
    
    // Intercept link clicks
    
    // Intercept form submissions (covers search buttons, login forms, etc.)
    



    // -------------------------------
    // Build DOM from JSON tree
    // -------------------------------
    
  </script>

</body>
</html>
